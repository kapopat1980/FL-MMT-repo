experiment_name: fl_mmt_centralised_baseline

model:
  hcma:
    dim: 512
    num_heads: 8
    num_layers: 4
    modalities: [ct, histo, genomic, clinical]
    dropout: 0.1
  task_heads:
    num_classes: 6
    num_risk_classes: 3
    num_time_bins: 20
    dropout: 0.3

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4

training:
  batch_size: 16
  epochs: 100
  seed: 42
  device: cuda
  modality_dropout_prob: 0.3

data:
  datasets: [lc25000, tcga_luad, tcga_lusc, lidc_idri, nlst, iq_oth_nccd]
  splits:
    train: 0.7
    val: 0.1
    test: 0.2

evaluation:
  mc_dropout_samples: 30
  ece_bins: 15
