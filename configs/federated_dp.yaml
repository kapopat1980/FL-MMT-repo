experiment_name: fl_mmt_federated_dp

model:
  hcma:
    dim: 512
    num_heads: 8
    num_layers: 4
    modalities: [ct, histo, genomic, clinical]
    dropout: 0.1
  task_heads:
    num_classes: 6
    num_risk_classes: 3
    num_time_bins: 20
    dropout: 0.3

federated:
  num_clients: 8
  communication_rounds: 100
  local_epochs: 1
  mu: 0.01               # FedProx proximal term
  client_fraction: 1.0    # fraction of clients sampled per round
  partition: dirichlet
  dirichlet_alpha: 0.5    # controls non-IID skew across clients

privacy:
  target_epsilon: 2.1
  target_delta: 1.0e-5
  max_grad_norm: 1.0

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4

training:
  batch_size: 16
  seed: 42
  device: cuda
  modality_dropout_prob: 0.3   # applied at training time for missing-modality robustness

data:
  datasets: [lc25000, tcga_luad, tcga_lusc, lidc_idri, nlst, iq_oth_nccd]
  splits:
    train: 0.7
    val: 0.1
    test: 0.2

evaluation:
  mc_dropout_samples: 30
  ece_bins: 15
  significance_test: wilcoxon
